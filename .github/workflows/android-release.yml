name: Android — tester et publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iris-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IRIS_PERSONAL_BOOTSTRAP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Contrôler la version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('mobile/pubspec.yaml').read_text()
          version, build = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', text, re.M).groups()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nbuild={build}\ntag=v{version}+{build}\n')
          PY
      - name: Détecter une version déjà publiée
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$DRAFT" = false || { echo 'Une publication inachevée existe pour cette version. La terminer ou choisir une nouvelle version.'; exit 1; }
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Vérifier que le numéro de build augmente
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          LAST_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            LAST_BUILD=${LAST_TAG##*+}
            test "$BUILD" -gt "$LAST_BUILD" || { echo 'Augmenter le numéro de build avant publication.'; exit 1; }
          fi
      - name: Tests Python autonomes
        env:
          PYTHONPATH: prototype
        run: python -m unittest test_mangatime test_distribution_engine
      - name: Tests de distribution
        run: python -m unittest discover -s scripts -p test_*.py
      - name: Préparer Flutter
        working-directory: mobile
        run: flutter pub get
      - name: Analyse et tests Flutter
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
      - name: Restaurer la clé de signature existante
        if: steps.existing.outputs.published != 'true'
        env:
          KEYSTORE: ${{ secrets.IRIS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Clé de signature manquante'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Compiler l’APK signée
        if: steps.existing.outputs.published != 'true'
        working-directory: mobile
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.workers.max=2\n' > "$HOME/.gradle/gradle.properties"
          flutter build apk --release
      - name: Vérifier la signature et préparer le manifeste
        if: steps.existing.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p distribution
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "distribution/Iris-$VERSION.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "distribution/Iris-$VERSION.apk" | tee distribution/signature.txt
          grep -q '0cb5b91691756ebe2b107ad6bd4a1c267b073752ae1478682ba7f91e28a287ad' distribution/signature.txt
          python scripts/release.py --apk "distribution/Iris-$VERSION.apk" --repository "$GITHUB_REPOSITORY" --output distribution/iris-update.json
      - name: Publier les fichiers ensemble
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "distribution/Iris-$VERSION.apk" distribution/iris-update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Iris $VERSION" --notes-file mobile/release-notes.txt --draft
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Effacer la clé du runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
